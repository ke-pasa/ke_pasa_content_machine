name: Process Article

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Article id to generate and publish'
        required: true
        default: ''

jobs:
  run-full-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: Upgrade pip
        run: |
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install root requirements
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Install worker-specific requirements
        run: |
          source .venv/bin/activate
          pip install -r workers/article_generator/requirements.txt || true
          pip install -r workers/publisher/requirements.txt || true

      - name: Prepare environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          source .venv/bin/activate
          # If Firebase credentials are provided as JSON string, write to file
          if [ -n "$FIREBASE_CREDENTIALS" ]; then
            echo "$FIREBASE_CREDENTIALS" > firebase_key.json
          fi

      - name: Run full generate and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source .venv/bin/activate
          python Scripts/full_generate_and_publish.py --article-id "${{ github.event.inputs.article_id }}"
