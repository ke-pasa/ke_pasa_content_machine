name: Publish

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to process (optional)'
        required: false
        default: '1'

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provenance - print trigger info
        run: |
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-${{ github.event_name }}}"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR:-${{ github.actor }}}"
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW:-${{ github.workflow }}}"
          echo "GITHUB_SHA=${GITHUB_SHA:-${{ github.sha }}}"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f workers/publisher/requirements.txt ]; then pip install -r workers/publisher/requirements.txt; fi

      - name: Write Firebase service account
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > /tmp/firebase_key.json
            echo "Wrote /tmp/firebase_key.json"
          else
            echo "FIREBASE_SERVICE_ACCOUNT secret not set; skipping write"
          fi

      - name: Export env vars
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV
          if [ -f /tmp/firebase_key.json ]; then echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase_key.json" >> $GITHUB_ENV; fi

      - name: Run publisher worker
        run: |
          python -m workers.publisher.worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase_key.json

      - name: Upload OpenAI raw logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-raw-logs
          path: logs/openai_raw
