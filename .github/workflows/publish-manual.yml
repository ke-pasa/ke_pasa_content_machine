name: Publish

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to process (optional)'
        required: false
        default: '1'
  schedule:
    - cron: '0 8-22 * * *'

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provenance - print trigger info
        run: |
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-${{ github.event_name }}}"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR:-${{ github.actor }}}"
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW:-${{ github.workflow }}}"
          echo "GITHUB_SHA=${GITHUB_SHA:-${{ github.sha }}}"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (optional)
        run: |
          sudo apt-get update || true
          # Add system deps here if needed (e.g. libxml2-dev libxslt-dev)
          echo "No extra system deps defined"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f workers/publisher/requirements.txt ]; then
            pip install -r workers/publisher/requirements.txt
          else
            echo "No workers/publisher/requirements.txt found, skipping."
          fi

      - name: Export env vars
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV
          # If you use Postgres in CI, set POSTGRES_URL secret; otherwise worker should fallback to configured DB
          echo "POSTGRES_URL=${{ secrets.POSTGRES_URL }}" >> $GITHUB_ENV

      - name: Run publisher worker (full)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.limit != '' && github.event.inputs.limit) || '3' }}
        run: |
          echo "Starting publisher worker (LIMIT=$LIMIT)"
          mkdir -p logs || true
          # Run the worker and capture stdout/stderr to a logfile so we can inspect for failures
          python -m workers.publisher.worker --limit "$LIMIT" 2>&1 | tee logs/publisher_run.log
          # If the worker prints known error markers, fail the step so the job is marked failed and artifacts are uploaded
          if grep -q -E "Errors occurred: [1-9]|Error publishing doc|Telegram send(Message|Photo) failed|Bad Request: message is too long" logs/publisher_run.log; then
            echo "Publisher reported errors; failing the job to trigger artifact upload"
            # print a short excerpt for convenience
            echo "--- Publisher log excerpt ---"
            grep -nE "Errors occurred: [1-9]|Error publishing doc|Telegram send(Message|Photo) failed|Bad Request: message is too long" -n logs/publisher_run.log || true
            exit 1
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-failure-logs-${{ matrix.python-version }}
          path: |
            logs/openai_raw/
            logs/publisher_run.log
            workers/publisher/*.log
          retention-days: 7

      - name: Upload processing results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: publish-results-${{ matrix.python-version }}
          path: |
            logs/openai_raw/
          retention-days: 30
