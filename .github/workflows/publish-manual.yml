name: Publish

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to process (optional)'
        required: false
        default: '1'
  schedule:
    - cron: '0 8-22 * * *'

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provenance - print trigger info
        run: |
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-${{ github.event_name }}}"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR:-${{ github.actor }}}"
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW:-${{ github.workflow }}}"
          echo "GITHUB_SHA=${GITHUB_SHA:-${{ github.sha }}}"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (optional)
        run: |
          sudo apt-get update || true
          # Add system deps here if needed (e.g. libxml2-dev libxslt-dev)
          echo "No extra system deps defined"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f workers/publisher/requirements.txt ]; then
            pip install -r workers/publisher/requirements.txt
          else
            echo "No workers/publisher/requirements.txt found, skipping."
          fi

      - name: Write Firebase service account key (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Writing firebase_key.json from FIREBASE_SERVICE_ACCOUNT secret"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase_key.json
            ls -l firebase_key.json || true
            echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/firebase_key.json" >> $GITHUB_ENV
          else
            echo "FIREBASE_SERVICE_ACCOUNT not set — skipping firebase_key.json write"
          fi

      - name: Export env vars
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV
          if [ -f "$GITHUB_WORKSPACE/firebase_key.json" ]; then echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase_key.json" >> $GITHUB_ENV; fi

      - name: Run publisher worker (full)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.limit != '' && github.event.inputs.limit) || '1' }}
        run: |
          echo "Starting publisher worker (LIMIT=$LIMIT)"
          python -m workers.publisher.worker --limit "$LIMIT"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-failure-logs-${{ matrix.python-version }}
          path: |
            logs/openai_raw/
            workers/publisher/*.log
          retention-days: 7

      - name: Upload processing results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: publish-results-${{ matrix.python-version }}
          path: |
            logs/openai_raw/
          retention-days: 30
