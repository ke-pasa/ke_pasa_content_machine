name: Deploy Workers to Server

on:
  workflow_dispatch:
    inputs:
      deploy_rss:
        description: 'Deploy RSS Worker'
        required: false
        default: true
        type: boolean
      deploy_categorization:
        description: 'Deploy Categorization Worker'
        required: false
        default: true
        type: boolean
      deploy_article_generator:
        description: 'Deploy Article Generator Worker'
        required: false
        default: true
        type: boolean
      deploy_publisher:
        description: 'Deploy Publisher Worker'
        required: false
        default: true
        type: boolean
      deploy_digest:
        description: 'Deploy Digest Worker'
        required: false
        default: true
        type: boolean
      deploy_events_importer:
        description: 'Deploy Events Importer Worker'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          POSTGRES_URL=${{ secrets.POSTGRES_URL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TELETHON_API_ID=${{ secrets.TELETHON_API_ID || '' }}
          TELETHON_API_HASH=${{ secrets.TELETHON_API_HASH || '' }}
          RSS_PARALLEL_FEEDS=${{ secrets.RSS_PARALLEL_FEEDS || '6' }}
          RSS_PURGE_DAYS=${{ secrets.RSS_PURGE_DAYS || '7' }}
          
          # X (Twitter) API OAuth 2.0 credentials
          X_CLIENT_ID=${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET=${{ secrets.X_CLIENT_SECRET }}
          X_REDIRECT_URI=http://localhost:8080/callback

          # Instagram API credentials
          INSTAGRAM_USER_ID=${{ secrets.INSTAGRAM_USER_ID || '' }}
          INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN || '' }}
          INSTAGRAM_SHORT_TOKEN=${{ secrets.INSTAGRAM_SHORT_TOKEN || '' }}
          INSTAGRAM_APP_SECRET=${{ secrets.INSTAGRAM_APP_SECRET || '' }}

          # Facebook API credentials
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID || '' }}
          FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET || '' }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID || '' }}
          FACEBOOK_PAGE_ACCESS_TOKEN=${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN || '' }}
          FACEBOOK_USER_TOKEN=${{ secrets.FACEBOOK_USER_TOKEN || '' }}

          GIT_KE_PASA_PAT=${{ secrets.GIT_KE_PASA_PAT }}
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_HOST }} >> ~/.ssh/known_hosts
          
          # Verify key format
          ssh-keygen -l -f ~/.ssh/deploy_key || (echo "Invalid SSH key format" && exit 1)

      - name: Deploy code to server
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.DEPLOY_SERVER_USER }}
        run: |
          # Create deployment directory on server
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
            ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST} \
            "mkdir -p ~/ke-pasa-workers"
          
          # Sync code to server (excluding unnecessary files)
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SERVER_PORT || '22' }}" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='venv*' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='tests' \
            --exclude='.pytest_cache' \
            --exclude='logs' \
            --exclude='articles' \
            --exclude='public' \
            ./ ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}:~/ke-pasa-workers/
          
          # Copy .env file
          scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
            .env \
            ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}:~/ke-pasa-workers/
          
          # Copy X OAuth tokens if available (Base64 encoded in secrets)
          # Only copy if file doesn't exist on server (to preserve auto-refreshed tokens)
          if [ ! -z "${{ secrets.X_TOKENS_BASE64 }}" ]; then
            TOKEN_EXISTS=$(ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
              ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST} \
              "test -f ~/ke-pasa-workers/.x_tokens.json && echo 'exists' || echo 'missing'")
            
            if [ "$TOKEN_EXISTS" = "missing" ]; then
              echo "X tokens not found on server, copying from secret..."
              echo "${{ secrets.X_TOKENS_BASE64 }}" | base64 -d > .x_tokens.json
              scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
                .x_tokens.json \
                ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}:~/ke-pasa-workers/
              rm -f .x_tokens.json
            else
              echo "X tokens already exist on server, skipping (preserving auto-refreshed tokens)"
            fi
          fi

          # Copy Instagram tokens if available (Base64 encoded in secrets)
          # Only copy if file doesn't exist on server (to preserve auto-refreshed tokens)
          if [ ! -z "${{ secrets.INSTAGRAM_TOKENS_BASE64 }}" ]; then
            TOKEN_EXISTS=$(ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
              ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST} \
              "test -f ~/ke-pasa-workers/.instagram_tokens.json && echo 'exists' || echo 'missing'")
            
            if [ "$TOKEN_EXISTS" = "missing" ]; then
              echo "Instagram tokens not found on server, copying from secret..."
              echo "${{ secrets.INSTAGRAM_TOKENS_BASE64 }}" | base64 -d > .instagram_tokens.json
              scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
                .instagram_tokens.json \
                ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}:~/ke-pasa-workers/
              rm -f .instagram_tokens.json
            else
              echo "Instagram tokens already exist on server, skipping (preserving auto-refreshed tokens)"
            fi
          fi

          # Copy Facebook tokens if available (Base64 encoded in secrets)
          # Only copy if file doesn't exist on server (to preserve auto-refreshed tokens)
          if [ ! -z "${{ secrets.FACEBOOK_TOKENS_BASE64 }}" ]; then
            TOKEN_EXISTS=$(ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
              ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST} \
              "test -f ~/ke-pasa-workers/.facebook_tokens.json && echo 'exists' || echo 'missing'")
            
            if [ "$TOKEN_EXISTS" = "missing" ]; then
              echo "Facebook tokens not found on server, copying from secret..."
              echo "${{ secrets.FACEBOOK_TOKENS_BASE64 }}" | base64 -d > .facebook_tokens.json
              scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
                .facebook_tokens.json \
                ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}:~/ke-pasa-workers/
              rm -f .facebook_tokens.json
            else
              echo "Facebook tokens already exist on server, skipping (preserving auto-refreshed tokens)"
            fi
          fi

      - name: Build and deploy on server
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.DEPLOY_SERVER_USER }}
          DEPLOY_RSS: ${{ github.event_name == 'push' || github.event.inputs.deploy_rss == 'true' }}
          DEPLOY_CAT: ${{ github.event_name == 'push' || github.event.inputs.deploy_categorization == 'true' }}
          DEPLOY_ART: ${{ github.event_name == 'push' || github.event.inputs.deploy_article_generator == 'true' }}
          DEPLOY_PUB: ${{ github.event_name == 'push' || github.event.inputs.deploy_publisher == 'true' }}
          DEPLOY_DIGEST: ${{ github.event_name == 'push' || github.event.inputs.deploy_digest == 'true' }}
          DEPLOY_EVENTS: ${{ github.event_name == 'push' || github.event.inputs.deploy_events_importer == 'true' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
            ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST} << 'ENDSSH'
          
          cd ~/ke-pasa-workers
          
          # Ensure token files exist as files (not directories) before docker compose
          echo "Ensuring token files exist..."
          
          # Check X tokens - only create if missing or empty (preserve auto-refreshed tokens)
          if [ -d ".x_tokens.json" ]; then
            echo "Removing directory .x_tokens.json"
            rm -rf ".x_tokens.json"
          fi
          if [ ! -f ".x_tokens.json" ] || [ ! -s ".x_tokens.json" ]; then
            if [ -n "${{ secrets.X_TOKENS_BASE64 }}" ]; then
              echo "Creating .x_tokens.json from GitHub Secret"
              echo "${{ secrets.X_TOKENS_BASE64 }}" | base64 -d > .x_tokens.json
              chmod 666 .x_tokens.json
            else
              echo "Creating empty .x_tokens.json"
              touch .x_tokens.json
              chmod 666 .x_tokens.json
            fi
          else
            echo ".x_tokens.json exists and is not empty - preserving existing file"
          fi
          
          # Check Instagram tokens - only create empty file if missing (will auto-populate from env vars)
          if [ -d ".instagram_tokens.json" ]; then
            echo "Removing directory .instagram_tokens.json"
            rm -rf ".instagram_tokens.json"
          fi
          if [ ! -f ".instagram_tokens.json" ]; then
            echo "Creating empty .instagram_tokens.json (will auto-populate from FACEBOOK_PAGE_ACCESS_TOKEN)"
            touch .instagram_tokens.json
            chmod 666 .instagram_tokens.json
          else
            echo ".instagram_tokens.json exists - preserving (may contain auto-refreshed token)"
          fi
          
          # Check Facebook tokens - only create empty file if missing (will auto-populate from env vars)
          if [ -d ".facebook_tokens.json" ]; then
            echo "Removing directory .facebook_tokens.json"
            rm -rf ".facebook_tokens.json"
          fi
          if [ ! -f ".facebook_tokens.json" ]; then
            echo "Creating empty .facebook_tokens.json (will auto-populate from FACEBOOK_PAGE_ACCESS_TOKEN)"
            touch .facebook_tokens.json
            chmod 666 .facebook_tokens.json
          else
            echo ".facebook_tokens.json exists - preserving (may contain auto-refreshed token)"
          fi
          
          # Build base image on server (ARM64)
          echo "Building base image on server..."
          docker build -f docker/Dockerfile.base -t ke-pasa-workers-base:latest .
          
          # Build only selected worker images on server
          if [ "${{ env.DEPLOY_RSS }}" == "true" ]; then
            echo "Building RSS worker..."
            docker build -f docker/Dockerfile.rss -t ke-pasa-rss-worker:latest .
          fi
          
          if [ "${{ env.DEPLOY_CAT }}" == "true" ]; then
            echo "Building Categorization worker..."
            docker build -f docker/Dockerfile.categorization -t ke-pasa-categorization-worker:latest .
          fi
          
          if [ "${{ env.DEPLOY_ART }}" == "true" ]; then
            echo "Building Article Generator worker..."
            docker build -f docker/Dockerfile.article_generator -t ke-pasa-article-generator-worker:latest .
          fi
          
          if [ "${{ env.DEPLOY_PUB }}" == "true" ]; then
            echo "Building Publisher worker..."
            docker build -f docker/Dockerfile.publisher -t ke-pasa-publisher-worker:latest .
          fi
          if [ "${{ env.DEPLOY_DIGEST }}" == "true" ]; then
            echo "Building Digest worker..."
            docker build -f docker/Dockerfile.digest -t ke-pasa-digest-worker:latest .
          fi

          if [ "${{ env.DEPLOY_EVENTS }}" == "true" ]; then
            echo "Building Events Importer worker..."
            docker build -f docker/Dockerfile.events_importer -t ke-pasa-events-importer-worker:latest .
          fi
          
          # Restart only selected workers
          echo "Restarting selected workers..."
          
          if [ "${{ env.DEPLOY_RSS }}" == "true" ]; then
            echo "Restarting RSS worker..."
            docker compose stop rss-worker || true
            docker compose up -d rss-worker
          fi
          
          if [ "${{ env.DEPLOY_CAT }}" == "true" ]; then
            echo "Restarting Categorization worker..."
            docker compose stop categorization-worker || true
            docker compose up -d categorization-worker
          fi
          
          if [ "${{ env.DEPLOY_ART }}" == "true" ]; then
            echo "Restarting Article Generator worker..."
            docker compose stop article-generator-worker || true
            docker compose up -d article-generator-worker
          fi
          
          if [ "${{ env.DEPLOY_PUB }}" == "true" ]; then
            echo "Restarting Publisher worker..."
            docker compose stop publisher-worker || true
            docker compose up -d publisher-worker
          fi

          if [ "${{ env.DEPLOY_DIGEST }}" == "true" ]; then
            echo "Restarting Digest worker..."
            docker compose stop digest-worker || true
            docker compose up -d digest-worker
          fi

          if [ "${{ env.DEPLOY_EVENTS }}" == "true" ]; then
            echo "Restarting Events Importer worker..."
            docker compose stop events-importer-worker || true
            docker compose up -d events-importer-worker
          fi
          
          # Clean up old images
          echo "Cleaning up old images..."
          docker image prune -f
          
          # Show status
          echo "Deployment complete! Container status:"
          docker compose ps
          
          # Show logs of restarted workers
          echo "Recent logs:"
          docker compose logs --tail=20
          
          ENDSSH

      - name: Verify deployment
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.DEPLOY_SERVER_USER }}
        run: |
          echo "Waiting 10 seconds for containers to stabilize..."
          sleep 10
          
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SERVER_PORT || '22' }} \
            ${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST} << 'ENDSSH'
          
          cd ~/ke-pasa-workers
          
          # Check if all containers are running
          RUNNING=$(docker compose ps --services --filter "status=running" | wc -l)
          TOTAL=$(docker compose ps --services | wc -l)
          
          echo "Running containers: $RUNNING / $TOTAL"
          
          if [ $RUNNING -eq $TOTAL ]; then
            echo "✅ All containers are running successfully!"
            exit 0
          else
            echo "❌ Some containers failed to start"
            docker compose ps
            docker compose logs --tail=100
            exit 1
          fi
          
          ENDSSH

      - name: Cleanup local files
        if: always()
        run: |
          rm -f .env
          rm -f ~/.ssh/deploy_key
