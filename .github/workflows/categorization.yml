name: Categorization Worker

on:
  schedule:
    # Run every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size to process (optional)'
        required: false
        default: '10'

jobs:
  categorize:
    name: Run categorization
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f workers/categorization/requirements.txt ]; then pip install -r workers/categorization/requirements.txt; fi

      - name: Prepare Firebase credentials
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase_key.json
          echo "Wrote firebase_key.json"
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/firebase_key.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CATEGORIZATION_PARALLELISM: 4


      - name: Run categorization CLI (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m workers.categorization.worker --action categorize --batch-size ${{ github.event.inputs.batch_size || '10' }}

      - name: Run categorization CLI (scheduled)
        if: github.event_name == 'schedule'
        run: |
          # Scheduled runs should process a large batch
          python -m workers.categorization.worker --action categorize --batch-size 2000

