name: RSS Worker

on:
  #schedule:
    # Run every 2 hours
    # - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      run_full:
        description: 'Set to true to run the full RSS worker (requires Firebase secret or other credentials)'
        required: false
        default: 'false'
  push:
    paths:
      - 'workers/rss/**'
      - '.github/workflows/rss-worker.yml'

jobs:
  rss-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f workers/rss/requirements.txt ]; then
          pip install -r workers/rss/requirements.txt
        else
          echo "No workers/rss/requirements.txt found, skipping."
        fi
        
    - name: Verify installation
      run: |
        python -c "import feedparser; print('feedparser:', getattr(feedparser, '__version__', 'unknown'))"
        python -c "import requests; print('requests:', requests.__version__)"
        python -c "import bs4; print('beautifulsoup4:', bs4.__version__)"
    
    - name: Write Firebase service account key (optional)
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
          echo "Writing firebase_key.json from FIREBASE_SERVICE_ACCOUNT secret"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase_key.json
          ls -l firebase_key.json || true
          # Export GOOGLE_APPLICATION_CREDENTIALS so Firebase SDKs pick it up
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/firebase_key.json" >> $GITHUB_ENV
        else
          echo "FIREBASE_SERVICE_ACCOUNT not set — skipping firebase_key.json write"
        fi

    - name: Run RSS Worker (full)
      if: github.event.inputs.run_full == 'true'
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        RSS_FEEDS_FILE: workers/rss/feeds.txt
        RSS_LOCK_LEASE_SEC: 1800
        RSS_MAX_ITEMS_PER_FEED: 50
      run: |
        echo "Starting full RSS Worker"
        python -m workers.rss.worker
        
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: rss-worker-logs-${{ matrix.python-version }}
        path: |
          workers/rss/*.log
          workers/rss/feeds_not_working.txt
          workers/rss/feeds_outdated.txt
        retention-days: 7
        
    - name: Upload processing results
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: rss-worker-results-${{ matrix.python-version }}
        path: |
          workers/rss/feeds_not_working.txt
          workers/rss/feeds_outdated.txt
        retention-days: 30