name: RSS Worker

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  rss-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ['3.13']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev libpq-dev netcat-openbsd

    - name: Require POSTGRES_URL secret
      run: |
        if [ -z "${{ secrets.POSTGRES_URL }}" ]; then
          echo "ERROR: secret POSTGRES_URL is not set. Set it in repository Secrets." >&2
          exit 1
        fi
        echo "POSTGRES_URL=${{ secrets.POSTGRES_URL }}" >> $GITHUB_ENV
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r workers/rss/requirements.txt
        
    - name: Verify installation
      run: |
        python -c "import feedparser; print('feedparser:', getattr(feedparser, '__version__', 'unknown'))"
        python -c "import requests; print('requests:', requests.__version__)"
        python -c "import bs4; print('beautifulsoup4:', bs4.__version__)"
    
    

    - name: Run RSS Worker (full)
      env:
        RSS_FEEDS_FILE: workers/rss/feeds.txt
        RSS_PARALLEL_FEEDS: 6
        POSTGRES_URL: ${{ env.POSTGRES_URL }}
        RSS_PURGE_DAYS: 15
      run: |
        echo "Starting full RSS Worker (running on Python ${{ matrix.python-version }})"
        python -m workers.rss.worker
    
        
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rss-worker-logs-${{ matrix.python-version }}
        path: |
          workers/rss/*.log
          workers/rss/feeds_not_working.txt
          workers/rss/feeds_outdated.txt
        retention-days: 7
        
    - name: Upload processing results
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: rss-worker-results-${{ matrix.python-version }}
        path: |
          workers/rss/feeds_not_working.txt
          workers/rss/feeds_outdated.txt
        retention-days: 30