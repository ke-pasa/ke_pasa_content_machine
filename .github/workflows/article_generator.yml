name: Article Generator

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size to process (optional)'
        required: false
        default: '5'
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'


jobs:
  run:
    name: Run Article Generator
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f workers/article_generator/requirements.txt ]; then pip install -r workers/article_generator/requirements.txt; fi

      - name: Write Firebase service account key
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "${FIREBASE_SERVICE_ACCOUNT}" > ${GITHUB_WORKSPACE}/firebase_key.json

      - name: Run article generator
        run: |
          if [ -n "${{ github.event.inputs.batch_size }}" ]; then
            # Manual trigger with custom batch size
            python -m workers.article_generator.worker --batch-size ${{ github.event.inputs.batch_size }}
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled run: batch_size=20
            python -m workers.article_generator.worker --batch-size 20
          else
            # No batch_size provided -> process all articles with expected status
            python -m workers.article_generator.worker
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase_key.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # (no ARTICLE_GENERATOR_FAIL_ON_ERRORS) - strict failure on collected errors by default

      - name: Push generated articles to external repo
        env:
          ARTICLES_REPO: "ke-pasa/ke_pasa_site"
          GIT_KE_PASA_PAT: ${{ secrets.GIT_KE_PASA_PAT }}
          ARTICLES_REPO_BRANCH: "main"
        run: |
          # If token not provided, skip the push step (runtime guard avoids linter issues)
          if [ -z "${GIT_KE_PASA_PAT:-}" ]; then
            echo "GIT_KE_PASA_PAT not set; skipping push step"
            exit 0
          fi
          set -euo pipefail
          git --version
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Cloning target repo ${ARTICLES_REPO} (branch: ${ARTICLES_REPO_BRANCH})"
          git clone https://${GIT_KE_PASA_PAT}@github.com/${ARTICLES_REPO} target_repo
          cd target_repo
          git checkout -B "${ARTICLES_REPO_BRANCH}"
          echo "Copying articles/ to target repo: src/content/news"
          mkdir -p src/content/news
          # Use rsync if available for cleaner sync; fallback to cp
          if command -v rsync >/dev/null 2>&1; then
            rsync -a $GITHUB_WORKSPACE/articles/ ./src/content/news/
          else
            rm -rf ./src/content/news || true
            mkdir -p ./src/content/news
            cp -R $GITHUB_WORKSPACE/articles/* ./src/content/news/ || true
          fi
          git add src/content/news
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update articles from CI run ${GITHUB_RUN_ID}"
            git push https://${GIT_KE_PASA_PAT}@github.com/${ARTICLES_REPO} HEAD:${ARTICLES_REPO_BRANCH}
          fi
