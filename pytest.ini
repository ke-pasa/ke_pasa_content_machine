[pytest]
# Pytest configuration file

# Only collect tests from the tests/ directory
testpaths = tests

# Ignore specific directories that contain test-like files but aren't actual tests
norecursedirs = 
    .git
    .venv
    venv_new
    .pytest_cache
    __pycache__
    scripts
    test-scripts
    tools
    workers
    src
    public
    .github

# Python files to consider as test files
python_files = test_*.py

# Python classes to consider as test classes
python_classes = Test*

# Python functions to consider as test functions
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Additional options
addopts = 
    -v
    --tb=short
    --strict-markers
