services:
  # Test service for debugging fonts
  test-fonts:
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: ke-pasa-workers-base:latest
    container_name: ke-pasa-test-fonts
    command: python test_fonts.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./test_fonts.py:/app/test_fonts.py
      - ./logs:/app/logs
    networks:
      - ke-pasa-network

  # RSS Worker - runs every 8 hours
  rss-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.rss
    image: ke-pasa-rss-worker:latest
    container_name: ke-pasa-rss-worker
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - OR_API_KEY=${OR_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-https://ke-pasa.es}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Ke Pasa Content Machine}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT_MINI=${AZURE_OPENAI_ENDPOINT_MINI}
      - AZURE_OPENAI_KEY_MINI=${AZURE_OPENAI_KEY_MINI}
      - AZURE_OPENAI_ENDPOINT_EMBEDDING=${AZURE_OPENAI_ENDPOINT_EMBEDDING}
      - AZURE_OPENAI_KEY_EMBEDDING=${AZURE_OPENAI_KEY_EMBEDDING}
      - RSS_FEEDS_FILE=workers/rss/feeds.txt
      - RSS_PARALLEL_FEEDS=${RSS_PARALLEL_FEEDS:-6}
      - RSS_PURGE_DAYS=${RSS_PURGE_DAYS:-7}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs/rss:/var/log/supervisor
    networks:
      - ke-pasa-network
    depends_on:
      - base

  # Categorization Worker - runs every 2 hours
  categorization-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.categorization
    image: ke-pasa-categorization-worker:latest
    container_name: ke-pasa-categorization-worker
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - OR_API_KEY=${OR_API_KEY}
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-https://ke-pasa.es}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Ke Pasa Content Machine}
      - CATEGORIZATION_MODEL_CHAIN=${CATEGORIZATION_MODEL_CHAIN:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash}
      - CATEGORIZATION_EMBEDDING_MODEL=${CATEGORIZATION_EMBEDDING_MODEL:-gemini-embedding-001}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT_MINI=${AZURE_OPENAI_ENDPOINT_MINI}
      - AZURE_OPENAI_KEY_MINI=${AZURE_OPENAI_KEY_MINI}
      - AZURE_OPENAI_ENDPOINT_EMBEDDING=${AZURE_OPENAI_ENDPOINT_EMBEDDING}
      - AZURE_OPENAI_KEY_EMBEDDING=${AZURE_OPENAI_KEY_EMBEDDING}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs/categorization:/var/log/supervisor
    networks:
      - ke-pasa-network
    depends_on:
      - base

  # Article Generator Worker - runs every 30 minutes
  article-generator-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.article_generator
    image: ke-pasa-article-generator-worker:latest
    container_name: ke-pasa-article-generator-worker
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - OR_API_KEY=${OR_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-https://ke-pasa.es}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Ke Pasa Content Machine}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT_MINI=${AZURE_OPENAI_ENDPOINT_MINI}
      - AZURE_OPENAI_KEY_MINI=${AZURE_OPENAI_KEY_MINI}
      - AZURE_OPENAI_ENDPOINT_EMBEDDING=${AZURE_OPENAI_ENDPOINT_EMBEDDING}
      - AZURE_OPENAI_KEY_EMBEDDING=${AZURE_OPENAI_KEY_EMBEDDING}
      - AZURE_DALLE_ENDPOINT=${AZURE_DALLE_ENDPOINT}
      - AZURE_DALLE_KEY=${AZURE_DALLE_KEY}
      - ARTICLE_GENERATOR_ENABLE_IMAGES=${ARTICLE_GENERATOR_ENABLE_IMAGES:-false}
      - PYTHONUNBUFFERED=1
      - GIT_KE_PASA_PAT=${GIT_KE_PASA_PAT}
      - ARTICLES_REPO=${ARTICLES_REPO:-ke-pasa/ke_pasa_site}
      - ARTICLES_REPO_BRANCH=${ARTICLES_REPO_BRANCH:-main}
    volumes:
      - ./logs/article_generator:/var/log/supervisor
    networks:
      - ke-pasa-network
    depends_on:
      - base

  # Publisher Worker - runs every hour
  publisher-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.publisher
    image: ke-pasa-publisher-worker:latest
    container_name: ke-pasa-publisher-worker
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - OR_API_KEY=${OR_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-https://ke-pasa.es}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Ke Pasa Content Machine}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT_MINI=${AZURE_OPENAI_ENDPOINT_MINI}
      - AZURE_OPENAI_KEY_MINI=${AZURE_OPENAI_KEY_MINI}
      - X_CLIENT_ID=${X_CLIENT_ID}
      - X_CLIENT_SECRET=${X_CLIENT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Instagram configuration
      - INSTAGRAM_USER_ID=${INSTAGRAM_USER_ID}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN:-}
      - INSTAGRAM_SHORT_TOKEN=${INSTAGRAM_SHORT_TOKEN:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - INSTAGRAM_EXPIRES_IN=${INSTAGRAM_EXPIRES_IN:-5184000}
      # Threads configuration (uses Instagram credentials but separate User ID)
      - THREADS_USER_ID=${THREADS_USER_ID:-}
      - THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN:-}
      # Facebook configuration  
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      - FACEBOOK_USER_TOKEN=${FACEBOOK_USER_TOKEN:-}
      # Azure Speech Services (Text-to-Speech for videos)
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}
      # Pexels API for video content
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      # Azure Storage for video hosting
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
      - AZURE_STORAGE_ACCOUNT_KEY=${AZURE_STORAGE_ACCOUNT_KEY}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs/publisher:/var/log/supervisor 
      # X tokens - can be updated during runtime, but not rebuilt into image on deploy
      - ./.x_tokens.json:/app/.x_tokens.json
      # Instagram and Facebook tokens (created automatically from env vars if missing)
      - ./.instagram_tokens.json:/app/.instagram_tokens.json
      - ./.facebook_tokens.json:/app/.facebook_tokens.json
    networks:
      - ke-pasa-network
    depends_on:
      - base

  # Digest Worker - separate container for digest publishing
  digest-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.digest
    image: ke-pasa-digest-worker:latest
    container_name: ke-pasa-digest-worker
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - OR_API_KEY=${OR_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-https://ke-pasa.es}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Ke Pasa Content Machine}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT_MINI=${AZURE_OPENAI_ENDPOINT_MINI}
      - AZURE_OPENAI_KEY_MINI=${AZURE_OPENAI_KEY_MINI}
      - AZURE_OPENAI_ENDPOINT_EMBEDDING=${AZURE_OPENAI_ENDPOINT_EMBEDDING}
      - AZURE_OPENAI_KEY_EMBEDDING=${AZURE_OPENAI_KEY_EMBEDDING}
      - AZURE_DALLE_ENDPOINT=${AZURE_DALLE_ENDPOINT}
      - AZURE_DALLE_KEY=${AZURE_DALLE_KEY}
      - X_CLIENT_ID=${X_CLIENT_ID}
      - X_CLIENT_SECRET=${X_CLIENT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELETHON_API_ID=${TELETHON_API_ID}
      - TELETHON_API_HASH=${TELETHON_API_HASH}
      - TELETHON_SESSION=${TELETHON_SESSION:-republish_session}
      # Facebook configuration (same as publisher)
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      - FACEBOOK_USER_TOKEN=${FACEBOOK_USER_TOKEN:-}
      # Instagram configuration (same as publisher)
      - INSTAGRAM_USER_ID=${INSTAGRAM_USER_ID}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN:-}
      - INSTAGRAM_SHORT_TOKEN=${INSTAGRAM_SHORT_TOKEN:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - INSTAGRAM_EXPIRES_IN=${INSTAGRAM_EXPIRES_IN:-5184000}
      # Threads configuration (uses Instagram credentials but separate User ID)
      - THREADS_USER_ID=${THREADS_USER_ID:-}
      - THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN:-}
      # Azure Storage for Instagram carousel hosting
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
      - AZURE_STORAGE_ACCOUNT_KEY=${AZURE_STORAGE_ACCOUNT_KEY}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs/digest:/var/log/supervisor
      - ./republish_session.session:/app/republish_session.session
      # Facebook token file (created from env or uploaded via CI)
      - ./.facebook_tokens.json:/app/.facebook_tokens.json
      # Instagram token file and envs (same as publisher)
      - ./.instagram_tokens.json:/app/.instagram_tokens.json
    networks:
      - ke-pasa-network
    depends_on:
      - base

  # Events Importer Worker - continuous folder watching + daily RSS
  events-importer-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.events_importer
    image: ke-pasa-events-importer-worker:latest
    container_name: ke-pasa-events-importer-worker
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - OR_API_KEY=${OR_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-https://ke-pasa.es}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Ke Pasa Content Machine}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs/events_importer:/var/log/supervisor
      - ./data/events:/app/data/events
    networks:
      - ke-pasa-network
    depends_on:
      - base

  # Base image builder (helper service)
  base:
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: ke-pasa-workers-base:latest
    container_name: ke-pasa-workers-base
    command: /bin/true
    networks:
      - ke-pasa-network

networks:
  ke-pasa-network:
    driver: bridge

volumes:
  logs:
    driver: local
